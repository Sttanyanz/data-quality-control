spring.application.name=data-quality-control
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:kkd}
spring.datasource.username=${DB_USERNAME:kkd}
spring.datasource.password=${DB_PASSWORD:kkd}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=false

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jackson.time-zone=UTC

# logging.level.org.springframework.jdbc.core=DEBUG