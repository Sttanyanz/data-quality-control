spring.application.name=data-quality-control
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5433/kkd
spring.datasource.username=kkd
spring.datasource.password=kkd
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=false
logging.level.org.springframework.jdbc.core=DEBUG
# Устанавливаем таймзону UTC для всех соединений с базой данных через HikariCP
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.jackson.time-zone=UTC