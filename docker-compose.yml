services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-kkd}
      POSTGRES_USER: ${DB_USERNAME:-kkd}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kkd}
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kkd} -d ${DB_NAME:-kkd}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [ pgdata:/var/lib/postgresql/data ]

volumes:
  pgdata: