services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: kkd
      POSTGRES_USER: kkd
      POSTGRES_PASSWORD: kkd
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkd -d kkd"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  pgdata: